basePath: /api/v1
definitions:
  handler.BetInput:
    properties:
      back:
        description: 后区 2 个号码
        example:
        - 10
        - 12
        items:
          type: integer
        type: array
      front:
        description: 前区 5 个号码
        example:
        - 4
        - 10
        - 12
        - 16
        - 20
        items:
          type: integer
        type: array
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        description: 新密码（至少6位）
        example: new123456
        type: string
      old_password:
        description: 原密码
        example: old123456
        type: string
    required:
    - new_password
    - old_password
    type: object
  handler.CreateUserRequest:
    properties:
      email:
        description: 邮箱（推荐填写，用于两步验证重置）
        example: lisi@example.com
        type: string
      nickname:
        description: 昵称
        example: 李四
        type: string
      password:
        description: 密码（至少6位）
        example: secret123
        type: string
      role:
        description: 角色：user | admin（默认 user）
        enum:
        - user
        - admin
        example: user
        type: string
      username:
        description: 用户名
        example: lisi
        type: string
    required:
    - password
    - username
    type: object
  handler.DeleteMeRequest:
    properties:
      password:
        description: 当前密码确认
        example: secret123
        type: string
    required:
    - password
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: 'failed to read uploaded image: ...'
        type: string
    type: object
  handler.LoginRequest:
    properties:
      password:
        description: 密码
        example: admin123
        type: string
      username:
        description: 用户名
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResponse:
    properties:
      expires_at:
        description: 过期时间（access 或 mfa_token 的）
        type: string
      mfa_required:
        description: MFARequired 为 true 时，需带上 mfa_token 调用 POST /auth/mfa/verify 完成登录。
        type: boolean
      mfa_token:
        description: MFAToken 是第二步验证用的短期令牌（5 分钟，一次性）。
        type: string
      token:
        description: 'JWT（放在 Authorization: Bearer <token> 头中）'
        type: string
      token_type:
        description: 恒为 Bearer
        type: string
      user:
        allOf:
        - $ref: '#/definitions/user.SafeUser'
        description: 用户信息（需要 MFA 第二步时不返回）
    type: object
  handler.MFADisableRequest:
    properties:
      code:
        description: 当前验证码
        example: "123456"
        type: string
      password:
        description: 当前密码
        example: secret123
        type: string
    required:
    - code
    - password
    type: object
  handler.MFAEnableRequest:
    properties:
      code:
        description: 认证器 App 当前 6 位验证码
        example: "123456"
        type: string
      secret:
        description: setup 返回的 secret
        example: JBSWY3DPEHPK3PXP
        type: string
    required:
    - code
    - secret
    type: object
  handler.MFAEnableResponse:
    properties:
      message:
        description: 提示信息
        type: string
    type: object
  handler.MFAResetConfirmRequest:
    properties:
      code:
        description: 邮箱收到的 6 位验证码
        example: "123456"
        type: string
      email:
        description: 账号绑定的邮箱
        example: user@example.com
        type: string
    required:
    - code
    - email
    type: object
  handler.MFAResetRequest:
    properties:
      email:
        description: 账号绑定的邮箱
        example: user@example.com
        type: string
      password:
        description: 账号密码
        example: secret123
        type: string
    required:
    - email
    - password
    type: object
  handler.MFASetupResponse:
    properties:
      otpauth_url:
        description: otpauth:// URI，可自行生成二维码
        type: string
      qr_code:
        description: data:image/png;base64,... 可直接放进 <img src>
        type: string
      secret:
        description: base32 密钥（手动输入时使用）
        type: string
    type: object
  handler.MFAVerifyRequest:
    properties:
      code:
        description: 认证器 App 当前 6 位验证码
        example: "123456"
        type: string
    required:
    - code
    type: object
  handler.ParseTicketResponse:
    properties:
      bets:
        description: 规范化后的号码
        items:
          $ref: '#/definitions/lottery.SuperLotto'
        type: array
      issue:
        description: 识别出的期号
        type: string
      total_bets:
        description: 注数
        type: integer
    type: object
  handler.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      nickname:
        description: 昵称（可选）
        example: 张三
        type: string
      password:
        description: 密码（至少6位）
        example: secret123
        type: string
      username:
        description: 用户名（3-32位字母/数字/下划线）
        example: zhangsan
        type: string
    required:
    - email
    - password
    - username
    type: object
  handler.ScanResponse:
    properties:
      raw:
        description: QR 码解码出的原始文本
        type: string
      ticket:
        allOf:
        - $ref: '#/definitions/lottery.SuperLotto'
        description: 识别出的号码
    type: object
  handler.TicketInput:
    properties:
      bets:
        description: 票面号码；与 text 二选一
        items:
          $ref: '#/definitions/handler.BetInput'
        type: array
      issue:
        description: 期号（可选）
        example: "26102"
        type: string
      text:
        description: 整票文本，一行一注；bets 为空时使用
        type: string
    type: object
  handler.UpdateUserRequest:
    properties:
      email:
        description: 邮箱（可选，本人或管理员可改）
        example: zhangsan@example.com
        type: string
      nickname:
        description: 昵称（可选）
        example: 张三
        type: string
      role:
        description: 角色（仅管理员可改）
        enum:
        - user
        - admin
        example: user
        type: string
    type: object
  handler.UserListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/user.SafeUser'
        type: array
      total:
        type: integer
    type: object
  handler.VerifyTicketRequest:
    properties:
      bets:
        description: 票面号码；与 text 二选一
        items:
          $ref: '#/definitions/handler.BetInput'
        type: array
      issue:
        description: 期号（可选）
        example: "26102"
        type: string
      text:
        description: 整票文本，一行一注；bets 为空时使用
        type: string
      winning_back:
        description: 开奖后区（可选）
        example: 06,07
        type: string
      winning_front:
        description: 开奖前区（可选）
        example: 01,03,07,27,28
        type: string
    type: object
  lottery.BetResult:
    properties:
      amount:
        description: 按奖池档位算出的单注奖金
        type: string
      back:
        description: 后区号码
        items:
          type: integer
        type: array
      front:
        description: 前区号码
        items:
          type: integer
        type: array
      index:
        description: 注序号（从 1 开始）
        type: integer
      matched_back:
        description: 命中后区个数
        type: integer
      matched_front:
        description: 命中前区个数
        type: integer
      prize:
        $ref: '#/definitions/lottery.Prize'
      won:
        description: 该注是否中奖
        type: boolean
    type: object
  lottery.Prize:
    properties:
      amount_above_8yi:
        description: 奖池 8 亿以上单注奖金
        type: string
      amount_below_8yi:
        description: 奖池 8 亿以下单注奖金
        type: string
      condition:
        description: 中奖条件，如"5+2"
        type: string
      tier:
        description: 奖级（一等奖=1 … 七等奖=7）
        type: integer
      tier_name:
        description: 奖级名称，如"一等奖"
        type: string
    type: object
  lottery.SuperLotto:
    properties:
      back:
        description: 后区号码
        example:
        - 1
        - 8
        items:
          type: integer
        type: array
      front:
        description: 前区号码
        example:
        - 5
        - 12
        - 18
        - 23
        - 35
        items:
          type: integer
        type: array
    type: object
  lottery.TicketVerifyResult:
    properties:
      bets:
        description: 逐注结果
        items:
          $ref: '#/definitions/lottery.BetResult'
        type: array
      issue:
        description: 期号
        type: string
      total_bets:
        description: 总注数
        type: integer
      total_won:
        description: 是否至少中一注
        type: boolean
      winning:
        allOf:
        - $ref: '#/definitions/lottery.WinningNumbers'
        description: 使用的开奖号码
      winning_bets:
        description: 中奖注数
        type: integer
    type: object
  lottery.VerifyResult:
    properties:
      matched_back:
        description: 命中后区个数
        type: integer
      matched_front:
        description: 命中前区个数
        type: integer
      prize:
        allOf:
        - $ref: '#/definitions/lottery.Prize'
        description: 中奖信息（未中奖时为 null）
      won:
        description: 是否中奖
        type: boolean
    type: object
  lottery.WinningNumbers:
    properties:
      back:
        description: 后区开奖号码
        example:
        - 6
        - 7
        items:
          type: integer
        type: array
      draw_time:
        description: 开奖日期
        example: "2026-09-07"
        type: string
      front:
        description: 前区开奖号码
        example:
        - 1
        - 3
        - 7
        - 27
        - 28
        items:
          type: integer
        type: array
      issue:
        description: 期号
        example: "26102"
        type: string
      pool_above_8yi:
        description: 奖池是否达到 8 亿
        type: boolean
      pool_balance:
        description: 开奖后奖池（元）
        type: number
    type: object
  user.SafeUser:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      mfa_enabled:
        description: 是否已开启两步验证
        type: boolean
      nickname:
        type: string
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: wechatapp-web
    url: http://www.swagger.io/support
  description: |-
    Image background replacement API. Uploads an image, removes its
    background via the remove.bg service, then optionally composites
    the cutout onto a new background (solid color or another image).
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: wechatapp-web API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates with username/password and returns a JWT to be
        sent as "Authorization: Bearer <token>".
      parameters:
      - description: Username and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: JWT and user info
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Missing fields
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Wrong username or password
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Login and get a JWT
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the presented JWT so it can no longer be used.
      responses:
        "200":
          description: 'message: 已退出登录'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout (revoke current token)
      tags:
      - auth
  /auth/me:
    delete:
      consumes:
      - application/json
      description: |-
        Deletes the authenticated user's own account after verifying
        the password, and revokes the current token. The last admin
        cannot be deleted this way.
      parameters:
      - description: Password confirmation
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.DeleteMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: 账号已注销'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Wrong password, or last admin cannot be deleted
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User no longer exists
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete my own account (注销账号)
      tags:
      - auth
    get:
      description: Returns the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: Current user profile
          schema:
            $ref: '#/definitions/user.SafeUser'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User no longer exists
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /auth/mfa:
    delete:
      consumes:
      - application/json
      description: |-
        Turns off two-factor authentication after verifying the
        account password and a current TOTP code.
      parameters:
      - description: Password and current code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.MFADisableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: 两步验证已关闭'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Wrong password or code
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Disable MFA
      tags:
      - mfa
  /auth/mfa/enable:
    post:
      consumes:
      - application/json
      description: |-
        Verifies the submitted code against the setup secret and
        stores it, turning on two-factor authentication.
      parameters:
      - description: Secret from setup and a current code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.MFAEnableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: MFA enabled
          schema:
            $ref: '#/definitions/handler.MFAEnableResponse'
        "400":
          description: Invalid secret or code
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm and enable MFA
      tags:
      - mfa
  /auth/mfa/reset/confirm:
    post:
      consumes:
      - application/json
      description: |-
        Verifies the emailed code and disables two-factor
        authentication so the user can log in again with just their
        password and re-enroll a fresh authenticator.
      parameters:
      - description: Email and emailed code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.MFAResetConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: 两步验证已重置'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Wrong/expired code or MFA not enabled
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Confirm an MFA reset with the emailed code
      tags:
      - mfa
  /auth/mfa/reset/request:
    post:
      consumes:
      - application/json
      description: |-
        When a user lost their authenticator, this sends a 6-digit
        verification code to the account email. Requires the account
        password. The response is generic to avoid account enumeration.
      parameters:
      - description: Email and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.MFAResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Generic success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid body
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Send an MFA reset code by email
      tags:
      - mfa
  /auth/mfa/setup:
    post:
      description: |-
        Generates a TOTP secret and provisioning URI/QR code. Nothing
        is persisted until /auth/mfa/enable confirms a valid code.
      produces:
      - application/json
      responses:
        "200":
          description: Secret, otpauth URL and QR code
          schema:
            $ref: '#/definitions/handler.MFASetupResponse'
        "400":
          description: MFA already enabled
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Begin MFA setup (生成 TOTP 密钥)
      tags:
      - mfa
  /auth/mfa/verify:
    post:
      consumes:
      - application/json
      description: |-
        Exchanges the short-lived mfa_token returned by /auth/login
        plus a TOTP code for a full access token.
      parameters:
      - description: TOTP code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.MFAVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Full access token
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Invalid code
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing/invalid/expired MFA challenge token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Complete login with the second factor
      tags:
      - mfa
  /auth/password:
    put:
      consumes:
      - application/json
      description: Changes the password of the authenticated user after verifying
        the old one.
      parameters:
      - description: Old and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: 密码修改成功'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid input or wrong old password
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User no longer exists
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change own password
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a normal (user-role) account. Login afterwards to get a
        token.
      parameters:
      - description: Username, password and optional nickname
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created user
          schema:
            $ref: '#/definitions/user.SafeUser'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Username already exists
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /lottery/parse-ticket:
    post:
      consumes:
      - application/json
      description: |-
        Validates client-supplied ticket numbers (from manual input or
        on-device OCR) and returns them normalized, so the app can show
        a confirmation screen before calling /lottery/verify-ticket.
      parameters:
      - description: Ticket numbers as bets or text
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.TicketInput'
      produces:
      - application/json
      responses:
        "200":
          description: Normalized issue and bets
          schema:
            $ref: '#/definitions/handler.ParseTicketResponse'
        "400":
          description: Missing input or invalid numbers (message names the offending
            bet/line)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Parse and normalize 大乐透 ticket numbers
      tags:
      - lottery
  /lottery/scan:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Decodes a QR-code image and extracts the 大乐透 numbers printed
        by the user (5 front numbers + 2 back numbers). The QR payload
        must contain 7 numbers, e.g. "05,12,18,23,35,01,08".
      parameters:
      - description: QR code image containing the ticket numbers
        in: formData
        name: qrcode
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Decoded raw text and recognized numbers
          schema:
            $ref: '#/definitions/handler.ScanResponse'
        "400":
          description: Missing qrcode, unreadable image, or unparseable numbers
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "422":
          description: Image decodes but contains no valid QR code
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Recognize 大乐透 numbers from a QR code
      tags:
      - lottery
  /lottery/verify:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Scans the QR code to get the user's printed numbers, then
        compares them with the given winning numbers and returns the
        prize tier if the ticket wins.
      parameters:
      - description: QR code image with the user's printed numbers
        in: formData
        name: qrcode
        required: true
        type: file
      - description: Winning front-area numbers, e.g. 05,12,18,23,35
        in: formData
        name: winning_front
        required: true
        type: string
      - description: Winning back-area numbers, e.g. 01,08
        in: formData
        name: winning_back
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Match counts and prize (won=false if no prize)
          schema:
            $ref: '#/definitions/lottery.VerifyResult'
        "400":
          description: Missing fields or invalid numbers
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "422":
          description: Image decodes but contains no valid QR code
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Verify a 大乐透 ticket against winning numbers
      tags:
      - lottery
  /lottery/verify-ticket:
    post:
      consumes:
      - application/json
      description: |-
        Verifies a printed 大乐透 ticket that may contain several bets
        (单式票通常 5 注). Numbers may be sent as structured bets or as
        multi-line text. Winning numbers can be supplied directly; if
        omitted and an issue is given, they are fetched from the
        official China Sports Lottery draw-history API.
      parameters:
      - description: Ticket bets and optional winning numbers
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Per-bet match counts, prize and totals
          schema:
            $ref: '#/definitions/lottery.TicketVerifyResult'
        "400":
          description: Invalid numbers or missing winning numbers/issue
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: Failed to fetch official winning numbers
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Verify a multi-bet 大乐透 ticket
      tags:
      - lottery
  /lottery/winning/{issue}:
    get:
      description: |-
        Fetches the official draw result for the given issue from the
        China Sports Lottery API (cached in memory).
      parameters:
      - description: Issue number, e.g. 26102
        in: path
        name: issue
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Official draw result
          schema:
            $ref: '#/definitions/lottery.WinningNumbers'
        "404":
          description: Issue not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: Upstream API error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get official 大乐透 winning numbers
      tags:
      - lottery
  /replace-background:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Uploads an image, removes its background with the remove.bg API,
        then optionally replaces the background with a solid color or another
        image. Returns the processed image directly as the response body.
      parameters:
      - description: Source image whose background will be removed
        in: formData
        name: image
        required: true
        type: file
      - description: Background image to place behind the cutout (wins over color)
        in: formData
        name: background
        type: file
      - description: 'Hex background color, e.g. #00aaff or #fff'
        in: formData
        name: color
        type: string
      - default: auto
        description: remove.bg size parameter
        in: formData
        name: size
        type: string
      - default: png
        description: Output image format
        enum:
        - png
        - jpeg
        in: formData
        name: format
        type: string
      produces:
      - image/png
      - image/jpeg
      responses:
        "200":
          description: Processed image (PNG or JPEG)
          schema:
            type: file
        "400":
          description: 'Bad request: missing image, unreadable file, or invalid color'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal error while composing the result
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "502":
          description: remove.bg upstream API error (e.g. invalid API key)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Replace image background
      tags:
      - background
  /users:
    get:
      description: Returns all accounts. Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: User list
          schema:
            $ref: '#/definitions/handler.UserListResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all users (admin)
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates an account with an explicit role. Admin only.
      parameters:
      - description: New account
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created user
          schema:
            $ref: '#/definitions/user.SafeUser'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Username already exists
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a user (admin)
      tags:
      - users
  /users/{id}:
    delete:
      description: Removes an account. Admin only.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: 用户已删除'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a user (admin)
      tags:
      - users
    get:
      description: Returns one account. Admin, or the user themselves.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User detail
          schema:
            $ref: '#/definitions/user.SafeUser'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Not allowed to view this user
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user detail
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates nickname (self or admin) and role (admin only).
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user
          schema:
            $ref: '#/definitions/user.SafeUser'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Not allowed to edit this user
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a user
      tags:
      - users
  /users/{id}/mfa:
    delete:
      description: |-
        Disables two-factor authentication for another account, for
        example when the user lost their authenticator. Admin only.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'message: 已重置该用户的两步验证'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Not an admin
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reset a user's MFA (admin)
      tags:
      - users
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: JWT issued by POST /auth/login, sent as "Bearer <token>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
